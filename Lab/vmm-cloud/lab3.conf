     setvar "attach_usb" "0";
    VJUNOS_INSTANCE(r3, vjunos_router_disk basedisk , VJUNOS_PRODUCT_VMX, 0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 0), r3ge0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 1), wan2)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 2), wan4)
  VJUNOS_END
  VJUNOS_CHASSIS_END

  #undef VJUNOS_CHASSIS_NAME
  #define VJUNOS_CHASSIS_NAME r4
  VJUNOS_CHASSIS_START()
  VJUNOS_START(r4, 0)
    setvar "attach_usb" "0";
    VJUNOS_INSTANCE(r4, vjunos_router_disk basedisk, VJUNOS_PRODUCT_VMX, 0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 0), r4ge0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 1), wan3)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 2), wan4)
  VJUNOS_END
  VJUNOS_CHASSIS_END

  vm "gw" {
    hostname "gw";
    gw_disk
    ncpus 2;
    memory 4096;
    setvar "+qemu_args" "-cpu qemu64,+vmx";
    setvar "attach_usb" "0";

    interface "em0" { 
        bridge "external"; 
        ext_vlanid 0;
    };
    interface "em1" { 
        bridge "mgmt"; 
        ext_vlanid 0;
    };
  };

  vm "svr1" {
    hostname "svr1";
    ubuntu_disk basedisk
    memory 2048;
    ncpus 1;
    setvar "attach_usb" "0";
    interface "em0" {
      bridge "r1ge0";
      ext_vlanid 0;
    };
  };
  vm "svr2" {
    hostname "svr1";
    ubuntu_disk basedisk
    memory 2048;
