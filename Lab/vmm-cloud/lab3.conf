    setvar "attach_usb" "0";
    interface "em0" {
      bridge "r2ge0";
      ext_vlanid 0;
    };
  };
  vm "svr3" {
    hostname "svr1";
    ubuntu_disk basedisk
    memory 2048;
    ncpus 1;
    setvar "attach_usb" "0";
    interface "em0" {
      bridge "r3ge0";
      ext_vlanid 0;
    };
  };
  vm "svr4" {
    hostname "svr1";
    ubuntu_disk basedisk
    memory 2048;
    ncpus 1;
    setvar "attach_usb" "0";
    interface "em0" {
      bridge "r4ge0";
      ext_vlanid 0;
    };
  };
    bridge "mgmt" {};
    bridge "r1ge0" {};
    bridge "r2ge0" {};
    bridge "r3ge0" {};
    bridge "r4ge0" {};
    bridge "wan1" {};
    bridge "wan2" {};
    bridge "wan3" {};
    bridge "wan4" {};
