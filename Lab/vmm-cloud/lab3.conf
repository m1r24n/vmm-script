#include "/vmm/bin/common.defs"
#include "/vmm/data/vmm-configs/common/vmxc/common.vjunos.defs"

#undef vjunos_router_disk
#define vjunos_router_disk basedisk "/vmm/data/user_disks/irzan/images/vJunos-router-26.2R1.7.qcow2";
#undef gw_disk
#define gw_disk basedisk "/vmm/data/user_disks/irzan/images/gw3.qcow2";
#undef ubuntu_disk
#define ubuntu_disk basedisk "/vmm/data/user_disks/irzan/images/ubuntu26.04v2.qcow2";

config "lab3" {

  #undef EM_IPADDR
  #define EM_IPADDR interface "em0" { bridge "mgmt";};
  #undef VJUNOS_CHASSIS_NAME
  #define VJUNOS_CHASSIS_NAME r1
  
  VJUNOS_CHASSIS_START()
  VJUNOS_START(r1, 0)
     setvar "attach_usb" "0";
    VJUNOS_INSTANCE(r1, vjunos_router_disk basedisk, VJUNOS_PRODUCT_VMX, 0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 0), r1ge0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 1), wan1)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 2), wan2)
  VJUNOS_END
  VJUNOS_CHASSIS_END

  #undef VJUNOS_CHASSIS_NAME
  #define VJUNOS_CHASSIS_NAME r2
  VJUNOS_CHASSIS_START()
  VJUNOS_START(r2, 0)
     setvar "attach_usb" "0";
    VJUNOS_INSTANCE(r2, vjunos_router_disk basedisk, VJUNOS_PRODUCT_VMX, 0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 0), r2ge0)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 1), wan1)
    VJUNOS_CONNECT(VJUNOS_GE(0, 0, 2), wan3)
  VJUNOS_END
  VJUNOS_CHASSIS_END

  #undef VJUNOS_CHASSIS_NAME
  #define VJUNOS_CHASSIS_NAME r3
