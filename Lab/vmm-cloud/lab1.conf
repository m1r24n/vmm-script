#include "/vmm/bin/common.defs"
#define UBUNTU basedisk "/vmm/data/user_disks/mochammad.irzan/vmm-images/unix/ubuntu2604.qcow2";
config "lab1" {

  vm "gw" {
    hostname "gw";
    UBUNTU
    memory 4096;
    ncpus 2;
    setvar "+qemu_args" " -cpu max";
    setvar "guest_os" "ubuntu";
    setvar "attach_usb" "0";
    interface "vio0" {
      bridge "external";
      ext_vlanid 0;
    };
    interface "vio1" {
      bridge "private1";
      ext_vlanid 0;
    };
  };

  vm "ubuntu1" {
    hostname "ubuntu1";
    UBUNTU
