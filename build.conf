#include "/vmm/bin/common.defs"
#define GW basedisk "/vmm/data/user_disks/mochammad.irzan/vmm-images/unix/gw.qcow2";
#define UBUNTU basedisk "/vmm/data/user_disks/mochammad.irzan/vmm-images/unix/ubuntu2604.qcow2";


config "local1" {

  bridge "lan1"{};
  bridge "lan2"{};
  vm "gw" {
    hostname "gw";
    GW
    memory 4096;
    ncpus 2;
    setvar "+qemu_args" " -cpu max";
    setvar "guest_os" "ubuntu";
    setvar "attach_usb" "0";
    interface "vio0" {
      bridge "external";
      ext_vlanid 0;
    };
    interface "vio1" {
      bridge "lan1";
      ext_vlanid 0;
    };
    interface "vio2" {
      bridge "lan2";
      ext_vlanid 0;
    };
  };
  vm "pc1" {
    hostname "pc1";
    UBUNTU
    memory 4096;
    ncpus 2;
    setvar "+qemu_args" " -cpu max";
    setvar "guest_os" "ubuntu";
    setvar "attach_usb" "0";
    interface "vio0" {
      bridge "lan1";
      ext_vlanid 0;
    };
  };
  vm "pc2" {
    hostname "pc2";
    UBUNTU
    memory 4096;
    ncpus 2;
    setvar "+qemu_args" " -cpu max";
    setvar "guest_os" "ubuntu";
    setvar "attach_usb" "0";
    interface "vio0" {
      bridge "lan1";
      ext_vlanid 0;
    };
  };
};